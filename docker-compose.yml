# ============================================
# AI Pajak - Docker Compose (Development)
# ============================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose up -d api      # Start API only
#   docker compose logs -f api    # View API logs
#   docker compose down           # Stop all services
# ============================================

services:
  # PostgreSQL Database
  # 이미 띄어져 있지 않는 경우는 밑의 uncomment 해서 사용하세요.
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: ai-pajak-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: ai_pajak
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d ai_pajak"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # NestJS API Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-pajak-api
    restart: unless-stopped
    ports:
      - '3333:3333'
    environment:
      NODE_ENV: production
      PORT: '3333'
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/ai_pajak?schema=public
      REDIS_HOST: host.docker.internal
      REDIS_PORT: '6379'
      PADDLEOCR_SERVICE_URL: http://host.docker.internal:8080
      PADDLEOCR_TIMEOUT_MS: '900000'  # 15 minutes for PDF processing
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./apps/api/uploads:/app/uploads
    # depends_on:
    #   redis:
    #     condition: service_healthy
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3333/health']
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # React Web Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai-pajak-web
    restart: unless-stopped
    ports:
      - '8088:80'
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80']
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # API Development Mode (with hot reload)
  api-dev:
    image: node:22-alpine
    container_name: ai-pajak-api-dev
    working_dir: /app
    ports:
      - '3333:3333'
    environment:
      NODE_ENV: development
      PORT: '3333'
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/ai_pajak?schema=public
      REDIS_HOST: host.docker.internal
      REDIS_PORT: '6379'
      PADDLEOCR_SERVICE_URL: http://host.docker.internal:8080
      PADDLEOCR_TIMEOUT_MS: '900000'  # 15 minutes for PDF processing
    # depends_on:
    #   redis:
    #     condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    command: sh -c "npm install && npx prisma generate && npm run dev:api"
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    profiles:
      - dev

  # Redis (Bull Queue)
  # 이미 띄어져 있지 않는 경우는 밑의 uncomment 해서 사용하세요.
  # redis:
  #   image: redis:7-alpine
  #   container_name: ai-pajak-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --appendonly yes
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # PaddleOCR Service (PP-OCRv5)
  # arm64 머신에서는 로컬로 직접 실행시키는 방법을 선택한다
  # paddleocr:
  #   platform: linux/amd64
  #   build:
  #     context: ./services/paddleocr
  #     dockerfile: Dockerfile
  #   container_name: ai-pajak-paddleocr
  #   restart: unless-stopped
  #   ports:
  #     - '8080:8080'
  #   environment:
  #     LOG_LEVEL: info
  #     PYTHONUNBUFFERED: '1'
  #   volumes:
  #     - paddleocr_models:/home/appuser/.paddleocr
  #   healthcheck:
  #     test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
  #     interval: 30s
  #     timeout: 10s
  #     start_period: 60s
  #     retries: 3

volumes:
  postgres_data:
  redis_data:
  paddleocr_models:
