<title>AI Pajak 테이블 정의서 · ERD</title>
<style>
:root{
  --bg:#F6F8F7; --surface:#FFFFFF; --ink:#18211D; --muted:#5F6E66; --line:#DCE4DF;
  --accent:#0E8A5F; --accent-ink:#0A6B4A; --accent-soft:#E3F2EB; --ghost:#9AA9A1;
  --code-bg:#EFF3F0; --pill-pk:#0E8A5F; --pill-fk:#3D6FB4; --pill-uq:#8A6D0E;
  --shadow:0 1px 2px rgba(24,33,29,.06),0 4px 16px rgba(24,33,29,.06);
  --erd-edge:#9DB3A8; --erd-edge-hi:#0E8A5F;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1512; --surface:#161D19; --ink:#E4ECE7; --muted:#93A39B; --line:#26302B;
  --accent:#34C08B; --accent-ink:#5CD3A5; --accent-soft:#17392B; --ghost:#5C6B64;
  --code-bg:#1D2621; --pill-pk:#1E7F5C; --pill-fk:#4A79B8; --pill-uq:#93762A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --erd-edge:#3D4A44; --erd-edge-hi:#34C08B;
}}
:root[data-theme="light"]{
  --bg:#F6F8F7; --surface:#FFFFFF; --ink:#18211D; --muted:#5F6E66; --line:#DCE4DF;
  --accent:#0E8A5F; --accent-ink:#0A6B4A; --accent-soft:#E3F2EB; --ghost:#9AA9A1;
  --code-bg:#EFF3F0; --pill-pk:#0E8A5F; --pill-fk:#3D6FB4; --pill-uq:#8A6D0E;
  --shadow:0 1px 2px rgba(24,33,29,.06),0 4px 16px rgba(24,33,29,.06);
  --erd-edge:#9DB3A8; --erd-edge-hi:#0E8A5F;
}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#161D19; --ink:#E4ECE7; --muted:#93A39B; --line:#26302B;
  --accent:#34C08B; --accent-ink:#5CD3A5; --accent-soft:#17392B; --ghost:#5C6B64;
  --code-bg:#1D2621; --pill-pk:#1E7F5C; --pill-fk:#4A79B8; --pill-uq:#93762A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --erd-edge:#3D4A44; --erd-edge-hi:#34C08B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:14px; line-height:1.55;
}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}

header.top{
  position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap;
}
header.top h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
header.top h1 small{color:var(--muted);font-weight:500;margin-left:8px;font-size:12px}
.stats{display:flex;gap:14px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
#search{
  margin-left:auto;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;
  padding:7px 12px;font:inherit;color:var(--ink);width:min(320px,60vw);
}
#search::placeholder{color:var(--muted)}

.wrap{display:flex;min-height:calc(100vh - 54px)}
nav.side{
  width:216px;flex:none;padding:16px 10px 32px;border-right:1px solid var(--line);
  position:sticky;top:54px;align-self:flex-start;max-height:calc(100vh - 54px);overflow-y:auto;
}
nav.side .navlbl{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:4px 10px 6px}
nav.side button{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  padding:7px 10px;border-radius:8px;font-size:13px;color:var(--ink);text-align:left;gap:8px;
}
nav.side button:hover{background:var(--code-bg)}
nav.side button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
nav.side button .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.side button.on .cnt{color:var(--accent-ink)}

main{flex:1;min-width:0;padding:20px 24px 80px}
section.block{margin:0 0 28px}
.blockhead{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.blockhead h2{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
.blockhead .sub{color:var(--muted);font-size:12px}

.erdcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow-x:auto;position:relative}
.erdhint{position:sticky;left:0;display:block;padding:8px 14px 0;color:var(--muted);font-size:12px}
.erdcard svg{display:block}
.erd-box{cursor:pointer}
.erd-box rect.frame{fill:var(--surface);stroke:var(--line)}
.erd-box.hi rect.frame{stroke:var(--accent);stroke-width:1.6}
.erd-box rect.head{fill:var(--accent-soft)}
.erd-box.ghost rect.frame{stroke-dasharray:4 3;fill:var(--bg)}
.erd-box.ghost rect.head{fill:var(--code-bg)}
.erd-box text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.erd-box text.tname{font-size:12px;font-weight:700;fill:var(--accent-ink)}
.erd-box.ghost text.tname{fill:var(--muted)}
.erd-box text.col{font-size:10.5px;fill:var(--ink)}
.erd-box text.col .key,.erd-box text.col tspan.key{fill:var(--muted);font-size:9px}
.erd-box text.rowsleft{font-size:10px;fill:var(--muted)}
path.edge{fill:none;stroke:var(--erd-edge);stroke-width:1.2}
path.edge.hi{stroke:var(--erd-edge-hi);stroke-width:1.8}
.edgehead{fill:var(--erd-edge)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.tcard{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;
  box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;
}
.tcard:hover{border-color:var(--accent)}
.tcard .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tcard .tname{font-weight:700;font-size:13.5px;color:var(--accent-ink)}
.tcard .badge{font-size:10px;padding:1px 7px;border-radius:99px;background:var(--code-bg);color:var(--muted);white-space:nowrap}
.tcard .badge.viewb{background:var(--accent-soft);color:var(--accent-ink)}
.tcard .desc{color:var(--ink);font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .meta{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;display:flex;gap:12px;flex-wrap:wrap}

#drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(560px,94vw);z-index:50;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 32px rgba(0,0,0,.14);
  transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;
}
@media (prefers-reduced-motion: reduce){#drawer{transition:none}}
#drawer.open{transform:none}
#drawer .dhead{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
#drawer .dhead .close{float:right;font-size:20px;line-height:1;color:var(--muted);padding:2px 8px;border-radius:6px}
#drawer .dhead .close:hover{background:var(--code-bg)}
#drawer .dhead h3{margin:0 0 2px;font-size:16px}
#drawer .dhead h3 code{color:var(--accent-ink)}
#drawer .dhead .dom{font-size:11px;color:var(--muted)}
#drawer .dbody{overflow-y:auto;padding:14px 20px 60px;flex:1}
#drawer .desc{font-size:13px;margin:0 0 12px}
#drawer h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.coltbl{width:100%;border-collapse:collapse;font-size:12px}
.coltbl th{color:var(--muted);font-weight:600;text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);font-size:11px}
.coltbl td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.coltbl td.cn{font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.coltbl td.ct{color:var(--muted);font-family:ui-monospace,Menlo,monospace;white-space:nowrap;font-size:11px}
.pill{display:inline-block;font-size:9.5px;font-weight:700;padding:0 5px;border-radius:4px;color:#fff;margin-right:3px;vertical-align:1px}
.pill.PK{background:var(--pill-pk)} .pill.FK{background:var(--pill-fk)} .pill.UQ{background:var(--pill-uq)}
.fklink{background:var(--code-bg);border-radius:6px;padding:2px 8px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;cursor:pointer;display:inline-block;margin:2px 4px 2px 0}
.fklink:hover{background:var(--accent-soft);color:var(--accent-ink)}
.uselist{margin:0;padding-left:18px;font-size:11.5px;color:var(--muted)}
.uselist code{font-size:11px}
#scrim{position:fixed;inset:0;background:rgba(10,16,13,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.open{opacity:1;pointer-events:auto}
.nores{color:var(--muted);padding:30px 0;text-align:center}
.mobiledom{display:none;gap:6px;overflow-x:auto;padding:0 0 12px;margin:-4px 0 4px}
.mobiledom button{flex:none;font-size:12px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.mobiledom button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
@media (max-width:760px){
  nav.side{display:none}
  main{padding:14px 12px 60px}
  .mobiledom{display:flex}
}
</style>

const byName = Object.fromEntries(DATA.tables.map(t => [t.name, t]));
const fkFrom = {}, fkTo = {};
for (const f of DATA.fks) { (fkFrom[f.from] ||= []).push(f); (fkTo[f.to] ||= []).push(f); }
const domCount = {}; for (const t of DATA.tables) domCount[t.domain] = (domCount[t.domain] || 0) + 1;

let curDomain = DATA.domains[0];
let query = '';

function setHTML(el, s) { el.replaceChildren(); el.insertAdjacentHTML('afterbegin', s); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

// ── sidebar ──
function renderNav() {
  const nav = document.getElementById('sidenav');
  nav.replaceChildren();
  const lbl = document.createElement('div'); lbl.className = 'navlbl'; lbl.textContent = '도메인'; nav.appendChild(lbl);
  for (const d of DATA.domains) {
    const b = document.createElement('button');
    setHTML(b, '<span>' + esc(d) + '</span><span class="cnt">' + (domCount[d] || 0) + '</span>');
    if (d === curDomain && !query) b.classList.add('on');
    b.onclick = () => { query = ''; document.getElementById('search').value = ''; setDomain(d); };
    nav.appendChild(b);
  }
  const mob = document.getElementById('mobiledom'); mob.replaceChildren();
  for (const d of DATA.domains) {
    const b = document.createElement('button'); b.textContent = d;
    if (d === curDomain && !query) b.classList.add('on');
    b.onclick = () => { query = ''; document.getElementById('search').value = ''; setDomain(d); };
    mob.appendChild(b);
  }
}
function setDomain(d) { curDomain = d; renderNav(); renderERD(); renderCards(); window.scrollTo({ top: 0 }); }

// ── ERD (layered layout: parents left → children right) ──
const BOXW = 208, ROWH = 15, HEADH = 26, GAPX = 96, GAPY = 18, PAD = 26;
function erdScope(domain) {
  const inDom = DATA.tables.filter(t => t.domain === domain).map(t => t.name);
  const inSet = new Set(inDom);
  const ghosts = new Set();
  const edges = [];
  for (const f of DATA.fks) {
    if (!inSet.has(f.from)) continue;
    if (f.from === f.to) continue;
    if (!inSet.has(f.to)) ghosts.add(f.to);
    edges.push(f);
  }
  return { nodes: inDom, ghosts: [...ghosts], edges };
}
function layerize(nodes, ghosts, edges) {
  const all = [...ghosts, ...nodes];
  const depth = Object.fromEntries(all.map(n => [n, 0]));
  for (let i = 0; i < 8; i++) {
    let moved = false;
    for (const e of edges) {
      if (depth[e.from] <= depth[e.to]) { depth[e.from] = depth[e.to] + 1; moved = true; }
    }
    if (!moved) break;
  }
  const layers = [];
  for (const n of all) { const d = depth[n]; (layers[d] ||= []).push(n); }
  return layers.filter(Boolean);
}
function keyCols(t) {
  const ks = t.cols.filter(c => c.k);
  return ks.length ? ks.slice(0, 7) : t.cols.slice(0, 4);
}
function boxH(name) { const t = byName[name]; if (!t) return HEADH + ROWH + 8; return HEADH + keyCols(t).length * ROWH + 8; }
function renderERD() {
  const { nodes, ghosts, edges } = erdScope(curDomain);
  document.getElementById('erdtitle').textContent = 'ERD — ' + curDomain;
  document.getElementById('erdsub').textContent = nodes.length + '개 테이블 · FK ' + edges.length + '건' + (ghosts.length ? ' · 점선 = 타 도메인 부모' : '');
  document.getElementById('erdhint').textContent = '박스를 클릭하면 컬럼 상세가 열립니다. 화살표: 자식(N) → 부모(1)';
  const layers = layerize(nodes, ghosts, edges);
  const pos = {};
  let maxH = 0;
  layers.forEach((layer, li) => {
    layer.sort((a, b) => a.localeCompare(b));
    let y = PAD;
    for (const n of layer) { pos[n] = { x: PAD + li * (BOXW + GAPX), y, h: boxH(n) }; y += boxH(n) + GAPY; }
    maxH = Math.max(maxH, y);
  });
  const W = PAD * 2 + layers.length * (BOXW + GAPX) - GAPX;
  const H = Math.max(maxH + PAD, 160);
  const ghostSet = new Set(ghosts);
  let svg = '<svg id="erdroot" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(curDomain) + ' ERD">';
  edges.forEach((e, ei) => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    let x1, x2;
    if (b.x + BOXW < a.x) { x1 = a.x; x2 = b.x + BOXW; }
    else { x1 = a.x + BOXW; x2 = b.x; }
    const y1 = a.y + HEADH / 2 + 4, y2 = b.y + HEADH / 2 + 4;
    const mx = (x1 + x2) / 2;
    svg += '<path class="edge" data-f="' + e.from + '" data-t="' + e.to + '" d="M' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2 + '"></path>';
    const dir = x2 > x1 ? -1 : 1;
    svg += '<polygon class="edgehead" points="' + x2 + ',' + y2 + ' ' + (x2 + 7 * dir) + ',' + (y2 - 3.5) + ' ' + (x2 + 7 * dir) + ',' + (y2 + 3.5) + '"></polygon>';
  });
  for (const [n, p] of Object.entries(pos)) {
    const t = byName[n];
    const ghost = ghostSet.has(n);
    svg += '<g class="erd-box' + (ghost ? ' ghost' : '') + '" data-n="' + n + '" transform="translate(' + p.x + ',' + p.y + ')">';
    svg += '<rect class="frame" width="' + BOXW + '" height="' + p.h + '" rx="8"></rect>';
    svg += '<rect class="head" width="' + BOXW + '" height="' + HEADH + '" rx="8"></rect><rect class="head" y="' + (HEADH - 8) + '" width="' + BOXW + '" height="8"></rect>';
    const nm = n.length > 23 ? n.slice(0, 22) + '…' : n;
    svg += '<text class="tname" x="10" y="17">' + esc(nm) + '</text>';
    if (t && !ghost) {
      svg += '<text class="rowsleft" x="' + (BOXW - 10) + '" y="17" text-anchor="end">' + t.rows.toLocaleString() + '</text>';
      keyCols(t).forEach((c, i) => {
        const y = HEADH + 12 + i * ROWH;
        const cn = c.n.length > 21 ? c.n.slice(0, 20) + '…' : c.n;
        svg += '<text class="col" x="10" y="' + y + '">' + esc(cn) + (c.k ? ' <tspan class="key">' + c.k + '</tspan>' : '') + '</text>';
      });
      const extra = t.cols.length - keyCols(t).length;
      if (extra > 0) svg += '<text class="col" x="10" y="' + (HEADH + 12 + keyCols(t).length * ROWH) + '" opacity=".55">+' + extra + ' cols…</text>';
    } else {
      const dom = t ? t.domain + ' 도메인' : (n === 'auth.users' ? 'Supabase auth 스키마' : '외부');
      svg += '<text class="col" x="10" y="' + (HEADH + 12) + '" opacity=".6">' + esc(dom) + '</text>';
    }
    svg += '</g>';
  }
  svg += '</svg>';
  setHTML(document.getElementById('erdsvg'), svg);
  const root = document.getElementById('erdroot');
  function hiEdges(n, on) {
    root.querySelectorAll('path.edge').forEach(p => {
      if (p.dataset.f === n || p.dataset.t === n) p.classList.toggle('hi', on);
    });
    root.querySelectorAll('.erd-box').forEach(b => b.classList.toggle('hi', on && b.dataset.n === n));
  }
  root.querySelectorAll('.erd-box').forEach(g => {
    g.addEventListener('click', () => openDrawer(g.dataset.n));
    g.addEventListener('mouseenter', () => hiEdges(g.dataset.n, true));
    g.addEventListener('mouseleave', () => hiEdges(g.dataset.n, false));
  });
}

// ── cards ──
function matches(t, q) { return t.name.includes(q) || t.desc.toLowerCase().includes(q) || t.domain.includes(q); }
function renderCards() {
  const wrap = document.getElementById('cards'); wrap.replaceChildren();
  const q = query.trim().toLowerCase();
  let list;
  if (q) {
    list = DATA.tables.filter(t => matches(t, q));
    document.getElementById('erdblock').style.display = 'none';
    document.getElementById('listsub').textContent = '검색 "' + query + '" — ' + list.length + '건';
  } else {
    list = DATA.tables.filter(t => t.domain === curDomain);
    document.getElementById('erdblock').style.display = '';
    document.getElementById('listsub').textContent = curDomain + ' ' + list.length + '개';
  }
  const vlist = q ? DATA.views.filter(v => v.name.includes(q) || v.desc.toLowerCase().includes(q)) : DATA.views.filter(v => v.domain === curDomain);
  if (!list.length && !vlist.length) { setHTML(wrap, '<div class="nores">일치하는 테이블이 없습니다</div>'); return; }
  for (const t of list) {
    const c = document.createElement('button'); c.className = 'tcard';
    setHTML(c,
      '<span class="row1"><span class="tname mono">' + esc(t.name) + '</span>' +
      (t.rls ? '' : '<span class="badge">RLS OFF</span>') + '</span>' +
      '<span class="desc">' + esc(t.desc) + '</span>' +
      '<span class="meta"><span>' + t.rows.toLocaleString() + ' rows</span><span>' + t.cols.length + ' cols</span>' +
      '<span>FK↓' + (fkFrom[t.name] || []).length + ' · ↑' + (fkTo[t.name] || []).length + '</span></span>');
    c.onclick = () => openDrawer(t.name);
    wrap.appendChild(c);
  }
  for (const v of vlist) {
    const c = document.createElement('div'); c.className = 'tcard';
    setHTML(c, '<span class="row1"><span class="tname mono">' + esc(v.name) + '</span><span class="badge viewb">VIEW</span></span>' +
      '<span class="desc">' + esc(v.desc) + '</span>');
    wrap.appendChild(c);
  }
}

// ── drawer ──
function openDrawer(name) {
  const t = byName[name]; if (!t) return;
  const d = document.getElementById('drawer');
  const outs = fkFrom[name] || [], ins = fkTo[name] || [];
  let h = '<div class="dhead"><button class="close" id="dclose" aria-label="닫기">×</button>' +
    '<h3><code>' + esc(t.name) + '</code></h3><div class="dom">' + esc(t.domain) + ' · ' + t.rows.toLocaleString() + ' rows · RLS ' + (t.rls ? 'ON' : 'OFF') + ' · PK <code>' + esc(t.pk || '—') + '</code></div></div>';
  h += '<div class="dbody"><p class="desc">' + esc(t.desc) + '</p>';
  h += '<h4>컬럼 ' + t.cols.length + '</h4><table class="coltbl"><tr><th>컬럼</th><th>타입</th><th>NULL</th><th>키 / FK 대상</th></tr>';
  for (const c of t.cols) {
    const pills = c.k ? c.k.split(',').map(k => '<span class="pill ' + k + '">' + k + '</span>').join('') : '';
    const fk = c.fk ? '<button class="fklink" data-go="' + esc(c.fk.t) + '">→ ' + esc(c.fk.t + '.' + c.fk.c) + '</button>' : '';
    h += '<tr><td class="cn">' + esc(c.n) + '</td><td class="ct">' + esc(c.t) + '</td><td>' + (c.null ? 'Y' : '<b>N</b>') + '</td><td>' + pills + ' ' + fk + '</td></tr>';
  }
  h += '</table>';
  if (outs.length) {
    h += '<h4>참조하는 부모 (FK →) ' + outs.length + '</h4><div>';
    for (const f of outs) h += '<button class="fklink" data-go="' + esc(f.to) + '">' + esc(f.fc) + ' → ' + esc(f.to + '.' + f.tc) + ' <span style="opacity:.6">' + esc(f.del) + '</span></button>';
    h += '</div>';
  }
  if (ins.length) {
    h += '<h4>참조받는 자식 (← FK) ' + ins.length + '</h4><div>';
    for (const f of ins) h += '<button class="fklink" data-go="' + esc(f.from) + '">' + esc(f.from + '.' + f.fc) + ' →</button>';
    h += '</div>';
  }
  if (t.use.length) {
    h += '<h4>주요 코드 사용처</h4><ul class="uselist">' + t.use.map(u => '<li><code>src/' + esc(u) + '</code></li>').join('') + '</ul>';
  }
  h += '</div>';
  setHTML(d, h);
  d.querySelector('#dclose').onclick = closeDrawer;
  d.querySelectorAll('.fklink[data-go]').forEach(b => { b.onclick = () => openDrawer(b.dataset.go); });
  d.classList.add('open');
  document.getElementById('scrim').classList.add('open');
  d.querySelector('.dbody').scrollTop = 0;
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}
document.getElementById('scrim').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value;
  renderNav(); renderCards();
});

renderNav(); renderERD(); renderCards();

</script>
