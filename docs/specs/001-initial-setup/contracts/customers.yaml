openapi: 3.1.0
info:
  title: AI Pajak - Customers API
  version: 1.0.0
  description: |
    고객 관리 API.
    PLATFORM_ADMIN은 고객 세무 데이터에 접근할 수 없습니다.

servers:
  - url: https://api.ai-pajak.com/v1
    description: Production

security:
  - bearerAuth: []

paths:
  /customers:
    get:
      summary: 고객 목록 조회
      operationId: listCustomers
      tags:
        - Customers
      description: |
        역할별 접근 권한:
        - CUSTOMER: 본인만 조회
        - CONSULTANT: 배정된 고객만 조회
        - TAX_ADVISOR: 모든 JTC 고객 조회
        - PLATFORM_ADMIN: ❌ 차단
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SortParam'
        - name: customer_type
          in: query
          schema:
            type: string
            enum: [INDIVIDUAL, UMKM, PT]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: 고객 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: 고객 등록
      operationId: createCustomer
      tags:
        - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: 고객 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: NPWP 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customers/{customer_id}:
    get:
      summary: 고객 상세 조회
      operationId: getCustomer
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/CustomerIdParam'
      responses:
        '200':
          description: 고객 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: 고객 정보 수정
      operationId: updateCustomer
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/CustomerIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      summary: 고객 삭제 (Soft Delete)
      operationId: deleteCustomer
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/CustomerIdParam'
      responses:
        '204':
          description: 삭제 성공
        '403':
          $ref: '#/components/responses/Forbidden'

  /customers/{customer_id}/poa:
    get:
      summary: 고객 위임장 목록
      operationId: listCustomerPOA
      tags:
        - Customers
        - POA
      parameters:
        - $ref: '#/components/parameters/CustomerIdParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_SIGNATURE, ACTIVE, EXPIRED, REVOKED]
      responses:
        '200':
          description: 위임장 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POAListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: 위임장 생성
      operationId: createPOA
      tags:
        - Customers
        - POA
      parameters:
        - $ref: '#/components/parameters/CustomerIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePOARequest'
      responses:
        '201':
          description: 위임장 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POAResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /customers/{customer_id}/poa/{poa_id}/sign:
    post:
      summary: 위임장 서명
      operationId: signPOA
      tags:
        - POA
      parameters:
        - $ref: '#/components/parameters/CustomerIdParam'
        - $ref: '#/components/parameters/POAIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signature_type
              properties:
                signature_type:
                  type: string
                  enum: [CUSTOMER, PARTNER]
      responses:
        '200':
          description: 서명 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POAResponse'
        '400':
          description: 이미 서명됨 또는 상태 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CustomerIdParam:
      name: customer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    POAIdParam:
      name: poa_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1

    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    SortParam:
      name: sort
      in: query
      schema:
        type: string
        example: "-created_at"

  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        npwp:
          type: string
          pattern: ^\d{2}\.\d{3}\.\d{3}\.\d-\d{3}\.\d{3}$
        full_name:
          type: string
        company_name:
          type: string
        customer_type:
          type: string
          enum: [INDIVIDUAL, UMKM, PT]
        address:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        has_active_poa:
          type: boolean
          description: 유효한 위임장 보유 여부
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCustomerRequest:
      type: object
      required:
        - npwp
        - full_name
      properties:
        npwp:
          type: string
          pattern: ^\d{2}\.\d{3}\.\d{3}\.\d-\d{3}\.\d{3}$
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        company_name:
          type: string
        customer_type:
          type: string
          enum: [INDIVIDUAL, UMKM, PT]
          default: INDIVIDUAL
        address:
          type: string
        phone:
          type: string

    UpdateCustomerRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        company_name:
          type: string
        address:
          type: string
        phone:
          type: string

    CustomerResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Customer'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    CustomerListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'

    POA:
      type: object
      properties:
        id:
          type: string
          format: uuid
        poa_number:
          type: string
        customer_id:
          type: string
          format: uuid
        tax_partner_id:
          type: string
          format: uuid
        tax_partner_name:
          type: string
          example: Jakarta Tax Consulting
        scope:
          type: string
          enum: [ALL_TAX_TYPES, PPH_21_ONLY, PPH_23_ONLY, SPT_TAHUNAN_ONLY]
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        status:
          type: string
          enum: [DRAFT, PENDING_SIGNATURE, ACTIVE, EXPIRED, REVOKED]
        customer_signed_at:
          type: string
          format: date-time
        partner_signed_at:
          type: string
          format: date-time
        document_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time

    CreatePOARequest:
      type: object
      required:
        - tax_partner_id
        - scope
        - valid_from
        - valid_to
      properties:
        tax_partner_id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [ALL_TAX_TYPES, PPH_21_ONLY, PPH_23_ONLY, SPT_TAHUNAN_ONLY]
          default: ALL_TAX_TYPES
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date

    POAResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/POA'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    POAListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/POA'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
        prev:
          type: string
        next:
          type: string
        last:
          type: string

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: 인증 필요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: 권한 없음 (PLATFORM_ADMIN 차단 포함)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
