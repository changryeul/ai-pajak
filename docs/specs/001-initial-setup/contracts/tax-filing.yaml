openapi: 3.1.0
info:
  title: AI Pajak - Tax Filing API
  version: 1.0.0
  description: |
    세금 신고 API.

    **중요 규칙**:
    - 모든 DJP 신고는 Jakarta Tax Consulting 명의로 제출됩니다.
    - TAX_ADVISOR만 신고 권한이 있습니다.
    - 유효한 POA(위임장) 없이는 신고할 수 없습니다.
    - PLATFORM_ADMIN은 세무 데이터에 접근할 수 없습니다.

servers:
  - url: https://api.ai-pajak.com/v1
    description: Production

security:
  - bearerAuth: []

paths:
  /tax-filings:
    get:
      summary: 세금 신고 목록
      operationId: listTaxFilings
      tags:
        - Tax Filing
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: customer_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tax_type
          in: query
          schema:
            type: string
            enum: [PPH_21, PPH_23, PPH_FINAL, PPN, SPT_TAHUNAN]
        - name: tax_year
          in: query
          schema:
            type: integer
        - name: tax_period
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}$
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_PAYMENT, READY_TO_SUBMIT, SUBMITTED, ACCEPTED, REJECTED]
      responses:
        '200':
          description: 신고 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxFilingListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: 세금 신고 생성
      operationId: createTaxFiling
      tags:
        - Tax Filing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxFilingRequest'
      responses:
        '201':
          description: 신고 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxFilingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /tax-filings/{filing_id}:
    get:
      summary: 세금 신고 상세
      operationId: getTaxFiling
      tags:
        - Tax Filing
      parameters:
        - $ref: '#/components/parameters/FilingIdParam'
      responses:
        '200':
          description: 신고 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxFilingResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: 세금 신고 수정
      operationId: updateTaxFiling
      tags:
        - Tax Filing
      description: DRAFT 상태에서만 수정 가능
      parameters:
        - $ref: '#/components/parameters/FilingIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaxFilingRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxFilingResponse'
        '400':
          description: DRAFT 상태가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tax-filings/{filing_id}/calculate:
    post:
      summary: 세금 계산
      operationId: calculateTax
      tags:
        - Tax Filing
      parameters:
        - $ref: '#/components/parameters/FilingIdParam'
      responses:
        '200':
          description: 계산 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCalculationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /tax-filings/{filing_id}/submit:
    post:
      summary: DJP 신고 제출
      operationId: submitTaxFiling
      tags:
        - Tax Filing
      description: |
        **제한**: TAX_ADVISOR만 제출 가능
        **요구사항**: 유효한 POA 필요
        **귀속**: Jakarta Tax Consulting 명의로 제출
      parameters:
        - $ref: '#/components/parameters/FilingIdParam'
      responses:
        '202':
          description: 제출 접수 (비동기 처리)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '400':
          description: POA 없음 또는 상태 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: TAX_ADVISOR만 제출 가능
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tax-filings/{filing_id}/e-billing:
    post:
      summary: e-Billing 생성
      operationId: generateEBilling
      tags:
        - Tax Filing
        - e-Billing
      parameters:
        - $ref: '#/components/parameters/FilingIdParam'
      responses:
        '201':
          description: e-Billing 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EBillingResponse'
        '400':
          description: 세금 계산 미완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: e-Billing 조회
      operationId: getEBilling
      tags:
        - Tax Filing
        - e-Billing
      parameters:
        - $ref: '#/components/parameters/FilingIdParam'
      responses:
        '200':
          description: e-Billing 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EBillingResponse'
        '404':
          description: e-Billing 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tax-filings/bulk-submit:
    post:
      summary: 일괄 DJP 신고 제출
      operationId: bulkSubmitTaxFilings
      tags:
        - Tax Filing
      description: |
        **제한**: TAX_ADVISOR만 제출 가능
        **최대**: 35건 동시 제출
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filing_ids
              properties:
                filing_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 35
      responses:
        '202':
          description: 일괄 제출 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSubmitResponse'
        '400':
          description: 일부 신고에 POA 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}:
    get:
      summary: 비동기 작업 상태 조회
      operationId: getJobStatus
      tags:
        - Jobs
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 작업 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FilingIdParam:
      name: filing_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1

    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100

  schemas:
    TaxFiling:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filing_number:
          type: string
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        customer_npwp:
          type: string
        tax_partner_id:
          type: string
          format: uuid
        tax_partner_name:
          type: string
          example: Jakarta Tax Consulting
        poa_id:
          type: string
          format: uuid
        tax_type:
          type: string
          enum: [PPH_21, PPH_23, PPH_FINAL, PPN, SPT_TAHUNAN]
        tax_period:
          type: string
          description: YYYY-MM (Masa) or YYYY (Tahunan)
        tax_year:
          type: integer
        status:
          type: string
          enum: [DRAFT, PENDING_PAYMENT, READY_TO_SUBMIT, SUBMITTED, ACCEPTED, REJECTED]
        filing_data:
          type: object
          description: 세금 유형별 데이터 (JSONB)
        calculated_tax:
          type: number
          format: decimal
        net_tax_due:
          type: number
          format: decimal
        submitted_at:
          type: string
          format: date-time
        submitted_by:
          type: object
          properties:
            user_id:
              type: string
              format: uuid
            consultant_id:
              type: string
              format: uuid
            consultant_name:
              type: string
        bpe:
          type: string
          description: DJP 접수증 번호
        djp_response:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTaxFilingRequest:
      type: object
      required:
        - customer_id
        - tax_type
        - tax_year
      properties:
        customer_id:
          type: string
          format: uuid
        tax_type:
          type: string
          enum: [PPH_21, PPH_23, PPH_FINAL, PPN, SPT_TAHUNAN]
        tax_year:
          type: integer
          minimum: 2020
          maximum: 2030
        tax_period:
          type: string
          pattern: ^\d{4}-\d{2}$
          description: Required for SPT Masa
        filing_data:
          type: object

    UpdateTaxFilingRequest:
      type: object
      properties:
        filing_data:
          type: object

    TaxFilingResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TaxFiling'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    TaxFilingListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaxFiling'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    TaxCalculation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tax_filing_id:
          type: string
          format: uuid
        gross_income:
          type: number
          format: decimal
        taxable_income:
          type: number
          format: decimal
        tax_rate:
          type: number
          format: decimal
        calculated_tax:
          type: number
          format: decimal
        credits:
          type: number
          format: decimal
        net_tax_due:
          type: number
          format: decimal
        calculation_details:
          type: object
          description: 계산 상세 내역
        calculated_at:
          type: string
          format: date-time

    TaxCalculationResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TaxCalculation'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    SubmitResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            job_id:
              type: string
            status:
              type: string
              enum: [queued, processing]
            filing_id:
              type: string
              format: uuid
            filed_by:
              type: string
              example: Jakarta Tax Consulting
        links:
          type: object
          properties:
            status:
              type: string
              format: uri

    BulkSubmitResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            job_id:
              type: string
            total:
              type: integer
            queued:
              type: integer
            failed:
              type: integer
            results:
              type: array
              items:
                type: object
                properties:
                  filing_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [queued, failed]
                  error:
                    type: string

    EBilling:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tax_filing_id:
          type: string
          format: uuid
        billing_code:
          type: string
          description: 16자리 e-Billing 코드
        amount:
          type: number
          format: decimal
        valid_until:
          type: string
          format: date
        status:
          type: string
          enum: [ACTIVE, EXPIRED, PAID]
        created_at:
          type: string
          format: date-time

    EBillingResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/EBilling'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    JobStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            job_id:
              type: string
            status:
              type: string
              enum: [queued, processing, completed, failed, cancelled]
            progress:
              type: integer
              minimum: 0
              maximum: 100
            result:
              type: object
              properties:
                bpe:
                  type: string
                submission_id:
                  type: string
            error:
              type: string
            created_at:
              type: string
              format: date-time
            completed_at:
              type: string
              format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
