<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI Pajak 상담원 업무함 v10</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--nav:#101827;--nav2:#1f2937;--navtxt:#d1d5db;--blue:#2563eb;--bs:#eff6ff;--red:#dc2626;--rs:#fef2f2;--amber:#d97706;--as:#fffbeb;--green:#16a34a;--gs:#ecfdf5;--purple:#7c3aed;--ps:#f5f3ff;--cyan:#0891b2;--cs:#ecfeff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--navtxt);height:100vh;position:sticky;top:0;overflow:auto;padding:18px 14px}.brand{display:flex;gap:10px;align-items:center;color:#fff;font-size:21px;font-weight:900;margin-bottom:22px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#22c55e);display:grid;place-items:center}
.st{font-size:11px;color:#9ca3af;margin:18px 10px 7px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}.nav{width:100%;border:0;background:transparent;color:var(--navtxt);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 11px;border-radius:10px;text-align:left;font:inherit;cursor:pointer}.nav:hover,.nav.active{background:var(--nav2);color:#fff}.sub{margin-left:8px;padding-left:8px;border-left:1px solid #253044}
.cnt{min-width:38px;height:26px;line-height:26px;border-radius:999px;background:#fff;color:#111827;font-size:15px;font-weight:1000;text-align:center;box-shadow:0 0 0 2px rgba(255,255,255,.2)}.cnt.red{background:#fee2e2;color:#7f1d1d}.cnt.amber{background:#fef3c7;color:#78350f}.cnt.green{background:#dcfce7;color:#14532d}.cnt.purple{background:#ede9fe;color:#4c1d95}.cnt.blue{background:#dbeafe;color:#1e3a8a}
.acct{margin-top:22px;padding:14px;border:1px solid #253044;border-radius:14px;background:rgba(255,255,255,.03)}.acct b{display:block;color:#fff}.acct span{display:block;color:#9ca3af;font-size:12px;margin-top:4px}
.top{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 22px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.role{display:flex;gap:8px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:900;cursor:pointer}.pill.active{background:var(--gs);border-color:#bbf7d0;color:#15803d}
.tools{display:grid;grid-template-columns:150px minmax(240px,1fr) 150px 160px;gap:8px}input,select,textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font:inherit;min-width:0}textarea{min-height:88px;resize:vertical}
.content{padding:22px}.grid{display:grid;grid-template-columns:392px minmax(0,1fr);gap:18px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.head h1{margin:0;font-size:22px}.head p{margin:6px 0 0;color:var(--muted);line-height:1.45}
.body{padding:18px}.badge{display:inline-flex;align-items:center;border-radius:99px;font-size:12px;font-weight:900;padding:5px 10px;white-space:nowrap}.blue{background:var(--bs);color:#1d4ed8}.red{background:var(--rs);color:#b91c1c}.amber{background:var(--as);color:#b45309}.green{background:var(--gs);color:#15803d}.purple{background:var(--ps);color:#6d28d9}.cyan{background:var(--cs);color:#0e7490}.gray{background:#f3f4f6;color:#4b5563}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qpanel{position:sticky;top:86px}.current{border:1px solid #bfdbfe;background:#eff6ff;border-radius:16px;padding:14px 14px;margin-bottom:10px;color:#1e40af}.current b{display:block;font-size:22px;line-height:1.1}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.metric{border:1px solid var(--line);border-radius:12px;background:#fff;padding:7px 6px;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;min-height:42px}.metric:hover{outline:2px solid #bfdbfe;background:#eff6ff}.metric small{color:var(--muted);font-weight:900;font-size:11px;white-space:nowrap}.metric b{font-size:17px}
.qlist{display:grid;gap:8px;max-height:370px;overflow:auto;padding-right:2px}.cust{border:1px solid var(--line);border-radius:15px;background:#fff;padding:12px;cursor:pointer}.cust:hover,.cust.active{outline:2px solid #bfdbfe;background:#eff6ff}.cust .ct{display:flex;justify-content:space-between;gap:8px}.cust b{display:block;font-size:14px}.cust span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pager{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:10px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}.panel h3{margin:0 0 9px;font-size:16px}.req{display:grid;gap:8px}.reqi{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafafa;font-size:13px}.reqi b{display:block}.reqi span{color:var(--muted)}
.m4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:15px}.metric2{border:1px solid var(--line);border-radius:15px;background:#fff;padding:13px}.metric2 small{display:block;color:var(--muted);font-weight:900}.metric2 b{font-size:20px}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar>div{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.blue{border-color:#bfdbfe;background:var(--bs);color:#1d4ed8}.btn.green{border-color:#bbf7d0;background:var(--gs);color:#15803d}.btn.purple{border-color:#ddd6fe;background:var(--ps);color:#6d28d9}.btn.red{border-color:#fecaca;background:var(--rs);color:#b91c1c}.btn.cyan{border-color:#a5f3fc;background:var(--cs);color:#0e7490}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:10px}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:#f9fafb;color:#4b5563;text-transform:uppercase;font-size:12px;letter-spacing:.03em}tr:hover{background:#f8fafc}tr.sel{background:#eef2ff}.money{text-align:right;font-variant-numeric:tabular-nums}.name b{display:block}.name span{font-size:12px;color:var(--muted)}
.section{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:16px;background:#fff}.section h3{margin:0;padding:14px 16px;background:#f9fafb;border-bottom:1px solid var(--line);font-size:16px}.field{display:grid;grid-template-columns:230px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}.field.need{background:var(--as)}.field.flag{background:var(--rs)}.field label{font-weight:900}.hint{font-size:12px;color:var(--muted);margin-top:3px}
.detail{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.di{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.di label{display:block;color:var(--muted);font-size:12px;font-weight:900;margin-bottom:5px}.ai{border:1px solid #bfdbfe;background:var(--bs);border-radius:16px;padding:14px;margin-top:14px;color:#1e3a8a}.ai b{display:block;color:#1d4ed8;margin-bottom:8px}.ai ul{margin:0;padding-left:20px}.calc{border:1px solid #bbf7d0;background:var(--gs);border-radius:16px;padding:14px;margin-top:14px;color:#14532d}.calc b{display:block;margin-bottom:8px}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;border:1px solid #bbf7d0;border-radius:10px;padding:10px;margin-top:8px;overflow:auto}.blocked{border:1px solid #fecaca;background:var(--rs);color:#991b1b;border-radius:14px;padding:12px;font-size:13px;line-height:1.45;margin-bottom:12px}
.evidence-link{border:0;background:transparent;color:#1d4ed8;font-weight:900;text-decoration:underline;cursor:pointer;padding:0;text-align:left}.coretax-box{border:1px solid #a5f3fc;background:var(--cs);border-radius:16px;padding:14px;margin:12px 0;color:#0e7490}.coretax-box b{display:block;margin-bottom:7px;color:#155e75}.coretax-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.float{position:fixed;right:22px;bottom:22px;border:0;border-radius:999px;background:#111827;color:#fff;padding:13px 17px;font-weight:900;cursor:pointer;box-shadow:0 12px 40px rgba(15,23,42,.24);z-index:7}.drawer{position:fixed;right:20px;bottom:78px;width:min(430px,calc(100vw - 40px));max-height:70vh;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 80px rgba(15,23,42,.25);display:none;z-index:8;overflow:hidden}.drawer.open{display:block}.dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.db{padding:14px;display:grid;gap:12px;max-height:50vh;overflow:auto}.df{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px}.msg{border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45;background:#f3f4f6}.msg.agent{background:var(--bs);color:#1e3a8a}.msg.supervisor{background:var(--ps);color:#4c1d95}
.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;place-items:center;z-index:9;padding:20px}.modalbg.open{display:grid}.modal{width:min(650px,100%);background:#fff;border-radius:18px;overflow:hidden}.modal h2{margin:0;padding:18px 20px;border-bottom:1px solid var(--line)}.mb{padding:20px;display:grid;gap:12px}.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:end;gap:8px}.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:13px 16px;border-radius:12px;display:none;z-index:10}.toast.show{display:block}
@media(max-width:1180px){.grid{grid-template-columns:1fr}.qpanel{position:static}.m4{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}.top{position:relative;grid-template-columns:1fr}.tools{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.m4{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}

.billing-mode .grid{grid-template-columns:minmax(0,1fr)}
.billing-mode .qpanel{display:none}
.billing-board{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.billing-col{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.04);overflow:hidden}
.billing-col-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f9fafb}
.billing-col-head h2{margin:0;font-size:20px}
.billing-col-body{padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.billing-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px;display:grid;gap:8px;min-width:0}
.billing-card:hover{outline:2px solid #bfdbfe;background:#f8fbff}
.billing-card-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.billing-card-title b{font-size:13px;line-height:1.25}
.billing-card-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px;align-items:center;font-size:11px}
.billing-card-row label{color:var(--muted);font-weight:900;font-size:10px}
.billing-card input{width:100%}
.billing-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.billing-card .btn{padding:6px 7px;font-size:11px}.billing-card .badge{font-size:10px;padding:4px 7px}.billing-card input{padding:7px 8px;font-size:11px}
@media(max-width:1280px){.billing-col-body{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:1050px){.billing-board{grid-template-columns:1fr}.billing-col-body{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.billing-col-body{grid-template-columns:1fr}}


.billing-target-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.billing-target-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px;display:grid;gap:10px}
.billing-target-card:hover{outline:2px solid #bfdbfe;background:#f8fbff}
.billing-company-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.billing-company-head b{font-size:15px;line-height:1.25}
.billing-email-row{display:grid;grid-template-columns:58px minmax(0,1fr);gap:6px;align-items:center;font-size:11px}
.billing-email-row label{font-weight:900;color:var(--muted)}
.tax-item{border:1px solid #e5e7eb;border-radius:12px;background:#fafafa;padding:9px;display:grid;gap:7px}
.tax-item-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tax-item-head b{font-size:12px}
.tax-item-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px;color:#4b5563}
.doc-list{display:grid;gap:5px}
.doc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;font-size:11px;border-top:1px dashed #e5e7eb;padding-top:5px}
.doc-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hidden-file{display:none}
.billing-issued-table{width:100%;min-width:900px}
.billing-issued-table th,.billing-issued-table td{font-size:12px;padding:9px}
.billing-issued-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}
.btn.disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:1400px){.billing-target-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.billing-target-grid{grid-template-columns:1fr}}


.evidence-modal{width:min(760px,100%);background:#fff;border-radius:18px;overflow:hidden}
.evidence-list{display:grid;gap:10px}
.evidence-card{border:1px solid var(--line);border-radius:14px;background:#f9fafb;padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.evidence-icon{width:38px;height:38px;border-radius:10px;background:#eef2ff;display:grid;place-items:center;font-size:20px}
.evidence-card b{display:block;font-size:14px}
.evidence-card span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.evidence-preview-box{border:1px dashed #cbd5e1;border-radius:14px;background:#f8fafc;padding:16px;text-align:center;color:#475569}
.wa-drawer{background:#efeae2}
.wa-chat{background:#efeae2;padding:12px;display:grid;gap:8px;max-height:48vh;overflow:auto}
.wa-date{justify-self:center;background:rgba(255,255,255,.8);color:#54656f;font-size:11px;border-radius:8px;padding:4px 9px;margin:4px 0}
.wa-bubble{max-width:78%;border-radius:8px;padding:7px 9px;box-shadow:0 1px 1px rgba(0,0,0,.08);font-size:13px;line-height:1.35}
.wa-bubble.me{justify-self:end;background:#d9fdd3;border-top-right-radius:2px}
.wa-bubble.them{justify-self:start;background:#fff;border-top-left-radius:2px}
.wa-meta{display:flex;justify-content:flex-end;gap:4px;align-items:center;color:#667781;font-size:10px;margin-top:3px}
.wa-read{color:#34b7f1;font-weight:900}
.wa-input{background:#f0f2f5}
.wa-input input{border-radius:999px}

</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">AI</div><div>AI Pajak</div></div>
    <div class="st">상담원 업무함</div>
    <button class="nav active" data-filter=""><span>📌 전체 고객 업무함</span><span class="cnt blue">128</span></button>
    <button class="nav" data-filter="unreviewed"><span>🔴 미검토 고객</span><span class="cnt red">31</span></button>
    <button class="nav" data-filter="inReview"><span>🟡 검토중</span><span class="cnt amber">44</span></button>
    <button class="nav" data-filter="request"><span>💬 수정작업중</span><span class="cnt red">18</span></button>
    <button class="nav" data-filter="reviewed"><span>🟢 검토완료</span><span class="cnt green">22</span></button>
    <div class="st">고객 입력자료 검토</div>
    <div class="sub">
      <button class="nav active view" data-view="pph21"><span>개인소득세 (PPh 21)</span></button>
      <button class="nav view" data-view="withholding"><span>원천세 (PPh 4(2), 15, 22, 23, 26)</span></button>
      <button class="nav view" data-view="umkm"><span>선납법인세 (PPh Final, 25)</span></button>
      <button class="nav view" data-view="ppn"><span>부가세 (PPN)</span></button>
      <button class="nav view" data-view="annual"><span>연 신고 (SPT)</span></button>
      <button class="nav view" data-view="employees"><span>직원 인사 기록</span></button>
    </div>
    <div class="st">상담원 처리업무</div>
    <div class="sub">
      <button class="nav view" data-view="billing"><span>ID Billing 발행</span><span class="cnt purple">12</span></button>
    </div>
    <div class="acct"><b>상담원 김민수</b><span>JTC Tax Operator</span></div>
  </aside>
  <main>
    <div class="top">
      <div class="role"><button class="pill active">상담원</button><button class="pill">수퍼바이저</button></div>
      <div class="tools">
        <input type="month" id="period" value="2026-07"/>
        <input id="search" placeholder="고객명, NPWP, 담당자 검색"/>
        <select id="statusFilter"><option value="">전체 상태</option><option value="unreviewed">미검토</option><option value="inReview">검토중</option><option value="request">수정작업중</option><option value="reviewed">검토완료</option><option value="billing">ID Billing 발행대기</option><option value="paid">납부확인</option><option value="completed">신고완료</option></select>
        <select id="sort"><option value="priority">상태 우선순 정렬</option><option value="deadline">마감일 빠른순</option><option value="name">고객명 가나다순</option><option value="taxdesc">세액 높은순</option><option value="updated">최근 업데이트순</option></select>
      </div>
      <select><option>한국어</option><option>English</option><option>Bahasa Indonesia</option></select>
    </div>
    <section class="content"><div class="grid"><aside class="qpanel"><div class="card"><div class="head"><div><h1>고객 업무함</h1></div></div><div class="body">
      <div id="current" class="current"></div>
      <div class="metrics"><div class="metric" data-quick="unreviewed"><small>미검토</small><b>31</b></div><div class="metric" data-quick="request"><small>수정중</small><b>18</b></div><div class="metric" data-quick="billing"><small>ID Billing</small><b>12</b></div><div class="metric" data-quick="completed"><small>신고완료</small><b>14</b></div></div>
      <div id="queue" class="qlist"></div><div class="pager"><span>1–20 / 128 고객</span><span>‹ 이전 · 다음 ›</span></div>
      <div class="panel"><h3>요청 현황</h3><div id="embeddedRequests" class="req"></div></div>
    </div></div></aside><div id="page"></div></div></section>
  </main>
</div>
<button class="float" id="messengerButton">💬 메신저 / 요청함</button>
<div id="drawer" class="drawer"><div class="dh"><b id="drawerTitle">메신저 / 요청함</b><button class="btn" id="closeDrawer">닫기</button></div><div class="db"><div id="drawerRequests" class="req"></div><div id="messages" class="req"></div></div><div class="df"><input id="chat" placeholder="메시지" style="flex:1"/><button class="btn blue" id="send">전송</button></div></div>
<div id="modalBg" class="modalbg"><div class="modal"><h2>요청</h2><div class="mb"><label>고객 화면 위치<input id="modalField" readonly/></label><label>고객에게 보낼 메시지<textarea id="modalMsg"></textarea></label><label>내부 메모<textarea id="modalMemo" placeholder="상담원/수퍼바이저에게만 보이는 메모"></textarea></label></div><div class="mf"><button class="btn" id="cancelModal">취소</button><button class="btn blue" id="saveModal">고객에게 표시</button></div></div></div>

<div id="evidenceModalBg" class="modalbg">
  <div class="evidence-modal">

function companyReady(company){return company.review==="수퍼바이저 승인완료" && company.templateDownloaded;}
function billingTargetTotal(company){return company.items.reduce((a,i)=>a+i.amount,0);}
function billingReadyCount(){return billingTargets.filter(companyReady).length;}
function downloadCompanyTemplate(id){
  const company=billingTargets.find(x=>x.id===id);
  if(company){company.templateDownloaded=true;}
  const a=document.createElement("a");
  a.href=FILLED_CORETAX_TEMPLATE;
  a.download=`AI_Pajak_Coretax_ID_Billing_${company?company.name.replaceAll(" ","_"):"Company"}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  renderBillingBoard();
  toast("해당 회사의 세금 계산내용이 채워진 Coretax 입력 준비파일을 다운로드했습니다.");
}

        <div class="billing-board">

function updateTargetEmail(id,value){
  const item=billingTargets.find(x=>x.id===id);
  if(item){item.email=value;toast("고객 이메일이 수정되었습니다.");}
}
function issueCompanyBilling(id){
  const idx=billingTargets.findIndex(x=>x.id===id);
  if(idx<0)return;
  const company=billingTargets[idx];
  if(!companyReady(company)){
    toast("수퍼바이저 승인완료 후 작성본 다운로드가 완료되어야 발행할 수 있습니다.");
    return;
  }
  billingTargets.splice(idx,1);
  company.items.forEach(item=>{
    billingIssued.unshift({
      id:Date.now()+Math.floor(Math.random()*10000),
      no:`BIL-${item.period.replace("-","")}-${String(billingIssued.length+1).padStart(3,"0")}`,
      name:company.name,
      tax:item.tax,
      period:item.period,
      amount:item.amount,
      email:company.email,
      sent:"미전송",
      ntpn:""
    });
  });
  renderBillingBoard();
  toast(`${company.name} ID Billing이 발행완료 리스트로 이동했습니다.`);
}
function sendBillingEmail(id){
  const item=billingIssued.find(x=>x.id===id);
  if(item){item.sent="전송완료";renderBillingBoard();toast("고객에게 ID Billing을 전송했습니다.");}
}
function completeByNtpn(id){
  const idx=billingIssued.findIndex(x=>x.id===id);
  if(idx<0)return;
  const item=billingIssued[idx];
  billingIssued.splice(idx,1);
  const matched=customers.find(c=>c.name===item.name);
  if(matched){matched.status="completed";matched.updated="2026-07-22 17:05";}
  renderBillingBoard();
  renderQueue();
  toast(`${item.name} ${item.tax} 완료 처리되었습니다. NTPN은 Coretax 자동생성 후 향후 연동 시 수집합니다.`);
}

function renderTask(){if(state.view==="billing"){renderBillingBoard();return;}document.body.classList.remove("billing-mode");const c=customer();const titles={billing:"ID Billing 발행",ntpn:"NTPN / 납부 확인",completed:"신고 완료 처리",employees:"직원 인사 기록"};pageShell(titles[state.view]||"상담원 처리업무",`<div class="m4"><div class="metric2"><small>대상 고객</small><b>${c.name.replace("PT ","")}</b></div><div class="metric2"><small>세목</small><b>${c.tax}</b></div><div class="metric2"><small>세액</small><b>${money(c.amount)}</b></div><div class="metric2"><small>상태</small><b>${label(c.status)}</b></div></div><div class="section"><h3>처리 단계</h3><div class="field"><div><label>1. 검토 완료 여부</label><div class="hint">고객 입력자료 검토 메뉴에서 확정</div></div><div>${["reviewed","billing","paid","completed"].includes(c.status)?"완료":"미완료"}</div><div></div></div><div class="field"><div><label>2. ID Billing 발행</label><div class="hint">Coretax 수동 처리 후 업로드</div></div><div>${["billing","paid","completed"].includes(c.status)?"대상":"대기"}</div><div><button class="btn purple" id="toBilling">ID Billing 등록</button></div></div><div class="field"><div><label>3. NTPN 확인</label><div class="hint">고객 납부 후 번호 확인</div></div><div>${["paid","completed"].includes(c.status)?"확인 가능":"대기"}</div><div><button class="btn blue" id="toPaid">NTPN 입력</button></div></div><div class="field"><div><label>4. 신고 완료</label><div class="hint">BPE 반영 후 고객에게 완료 표시</div></div><div>${c.status==="completed"?"완료":"대기"}</div><div><button class="btn green" id="toComplete">신고완료 처리</button></div></div></div>`);document.getElementById("toBilling").addEventListener("click",()=>setStatus("billing"));document.getElementById("toPaid").addEventListener("click",()=>setStatus("paid"));document.getElementById("toComplete").addEventListener("click",()=>setStatus("completed"))}
function hasOpenItems(){const openReq=state.requests.some(r=>r.customer===state.selectedCustomer&&r.status!=="완료");if(openReq)return true;if(state.view==="pph21")return employees.some(e=>e.level!=="green");if(state.view==="withholding")return withholdingRows.some(r=>r.level!=="green");if(state.view==="ppn")return ppnSales.some(r=>r.level!=="green")||ppnPurchases.some(r=>r.level!=="green");if(state.view==="umkm")return true;if(state.view==="annual")return true;return false}
function tryReviewDone(){if(hasOpenItems()){const msg="아직 완료되지 않은 직원/거래/대조결과 또는 고객에게 보낸 요청이 남아 있습니다. 모든 항목을 완료 처리한 후 수퍼바이저 승인완료가 가능합니다.";if(state.view==="pph21")renderPph21(msg);else if(state.view==="withholding")renderWithholding(msg);else if(state.view==="ppn")renderPpn(msg);else if(state.view==="umkm")renderCit(msg);else renderAnnual(msg);toast("미완료 항목이 남아 있어 수퍼바이저 승인완료 처리할 수 없습니다.");return}setStatus("reviewed")}
function setStatus(s){const c=customer();c.status=s;c.updated="2026-07-22 10:35";renderAll();toast(`${c.name} 상태가 '${label(s)}'로 변경되었습니다.`)}
function openEvidence(title,files){
  const list=String(files).split(",").map(x=>x.trim()).filter(Boolean);
  document.getElementById("evidenceTitle").textContent=title;
  document.getElementById("evidencePreview").innerHTML=`<b>${title}</b><br><span style="font-size:12px;color:#64748b">아래 증빙을 클릭하면 미리보기 영역에 표시됩니다. 실제 서비스에서는 업로드된 원본 파일/PDF/이미지를 이 영역에서 바로 보여줍니다.</span>`;
  document.getElementById("evidenceList").innerHTML=list.length ? list.map((f,i)=>`
    <div class="evidence-card" onclick="previewEvidence('${String(title).replace(/'/g,"\\'")}', '${String(f).replace(/'/g,"\\'")}')">
      <div class="evidence-icon">${f.toLowerCase().includes("pdf")||f.toLowerCase().includes("invoice")?"📄":f.toLowerCase().includes("계약")||f.toLowerCase().includes("contract")?"📑":"🧾"}</div>
      <div><b>${f}</b><span>원천세 거래 증빙 · 클릭하여 미리보기</span></div>
      <button class="btn blue">보기</button>
    </div>`).join("") : `<div class="reqi"><b>증빙 없음</b><span>이 거래에 연결된 증빙자료가 없습니다.</span></div>`;
  document.getElementById("evidenceModalBg").classList.add("open");
}
function previewEvidence(title,file){
  document.getElementById("evidencePreview").innerHTML=`<b>${file}</b><br><br><div style="font-size:13px;line-height:1.6">거래: ${title}<br>상태: 연결된 증빙 확인 가능<br><br>실제 서비스에서는 이곳에 PDF/이미지/원본파일 미리보기가 표시됩니다.</div>`;
}

function openRequest(field){state.selectedField=field;document.querySelector("#modalBg h2").textContent="요청";document.getElementById("modalField").value=field;document.getElementById("modalMsg").value=`${field} 항목 확인 또는 보완이 필요합니다. 고객 화면의 해당 항목에서 내용을 수정하거나 관련 자료를 업로드해 주세요.`;document.getElementById("modalMemo").value="";document.getElementById("modalBg").classList.add("open")}
function saveRequest(){const c=customer();const now="2026-07-22 10:35";const msg=document.getElementById("modalMsg").value;state.requests.unshift({customer:c.id,field:state.selectedField,msg,status:"요청중",requestedAt:now,requestedBy:"상담원 김민수"});state.messages.push({customer:c.id,from:"상담원 김민수",type:"agent",text:msg});c.status="request";closeModal();renderAll();toast("고객 화면과 메신저에 요청이 표시되었습니다.")}
function closeModal(){document.getElementById("modalBg").classList.remove("open");document.querySelector("#modalBg h2").textContent="요청"}function renderMessenger(){
  const c=customer();
  const reqs=state.requests.filter(r=>r.customer===c.id);
  const msgs=state.messages.filter(m=>m.customer===c.id);
  document.getElementById("drawerTitle").textContent=`${c.name}`;
  const drawer=document.getElementById("drawer");
  drawer.classList.add("wa-drawer");
  document.getElementById("drawerRequests").innerHTML=reqs.length?`<div class="reqi" style="background:#fff"><b>요청 ${reqs.length}건</b><span>${reqs.map(r=>r.field).join(" · ")}</span></div>`:"";
  document.getElementById("messages").className="wa-chat";
  document.getElementById("messages").innerHTML=[
    `<div class="wa-date">오늘</div>`,
    ...msgs.map((m,i)=>{
      const mine=m.type==="agent" || m.from==="상담원 김민수";
      const time=i%2===0?"10:18":"10:21";
      return `<div class="wa-bubble ${mine?"me":"them"}">
        <div>${m.text}</div>
        <div class="wa-meta"><span>${time}</span>${mine?`<span class="wa-read">✓✓</span>`:""}</div>
      </div>`;
    })
  ].join("") || `<div class="wa-date">오늘</div><div class="wa-bubble them"><div>대화 내역이 없습니다.</div><div class="wa-meta"><span>10:00</span></div></div>`;
  document.querySelector(".df")?.classList.add("wa-input");
}
function toggleDrawer(){document.getElementById("drawer").classList.toggle("open");renderMessenger()}function sendMessage(){const input=document.getElementById("chat");if(!input.value.trim())return;state.messages.push({customer:state.selectedCustomer,from:"상담원 김민수",type:"agent",text:input.value.trim()});input.value="";renderMessenger();toast("메시지를 보냈습니다.")}function renderAll(){renderQueue();renderPage();renderMessenger()}function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
document.getElementById("search").addEventListener("input",renderQueue);document.getElementById("statusFilter").addEventListener("change",renderQueue);document.getElementById("sort").addEventListener("change",renderAll);document.getElementById("period").addEventListener("change",renderPage);document.getElementById("messengerButton").addEventListener("click",toggleDrawer);document.getElementById("closeDrawer").addEventListener("click",toggleDrawer);document.getElementById("send").addEventListener("click",sendMessage);document.getElementById("cancelModal").addEventListener("click",closeModal);document.getElementById("saveModal").addEventListener("click",saveRequest);document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal()});document.querySelectorAll("[data-quick]").forEach(el=>el.addEventListener("click",()=>{document.getElementById("statusFilter").value=el.dataset.quick;renderQueue()}));document.querySelectorAll("[data-filter]").forEach(el=>el.addEventListener("click",()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));el.classList.add("active");document.getElementById("statusFilter").value=el.dataset.filter;renderQueue()}));document.querySelectorAll(".view").forEach(el=>el.addEventListener("click",()=>{document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));el.classList.add("active");state.view=el.dataset.view;renderPage()}));

document.getElementById("closeEvidenceModal").addEventListener("click",()=>document.getElementById("evidenceModalBg").classList.remove("open"));
document.getElementById("evidenceModalBg").addEventListener("click",e=>{if(e.target.id==="evidenceModalBg")document.getElementById("evidenceModalBg").classList.remove("open")});
renderAll();
</script>
</body>
</html>
