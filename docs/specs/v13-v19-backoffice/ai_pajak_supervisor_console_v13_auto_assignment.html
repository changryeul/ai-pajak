function renderEvaluation(){setTitle("evaluation","evaluationDesc");const sorted=counselors.slice().sort((a,b)=>b.score-a.score);document.getElementById("page").innerHTML=`<div class="card"><div class="card-head"><div><h2>${t("counselorRank")}</h2><p>${t("evidenceMetrics")}</p></div></div><div class="card-body"><div class="table-wrap"><table><thead><tr><th>${t("rank")}</th><th>${t("counselor")}</th><th>${t("belonging")}</th><th>${t("specialty")}</th><th>${t("processed")}</th><th>${t("avgTime")}</th><th>${t("approvalPass")}</th><th>${t("rejectionRate")}</th><th>${t("accuracy")}</th><th>${t("dueCompliance")}</th><th>${t("score")}</th></tr></thead><tbody>${sorted.map((c,i)=>`<tr><td><b>${i+1}</b></td><td><b>${C(c)}</b><br>${t(c.status)}</td><td>${c.supervisor}</td><td>${c.specialty}</td><td>${c.done}</td><td>${c.avg}</td><td>${c.pass}%</td><td>${c.reject}%</td><td>${c.accuracy}%</td><td>${c.due}%</td><td><b>${c.score}</b></td></tr>`).join("")}</tbody></table></div></div></div>`}
function statusDot(s){return s==="statusOffline"?"off":s==="statusRest"?"rest":""}
function renderAffiliation(){setTitle("affiliation","affiliationDesc");document.getElementById("page").innerHTML=`<div class="supervisor-grid">${supervisors.map(s=>{const staff=counselors.filter(c=>c.supervisor===s.name);return `<div class="supervisor-card"><h2 style="margin:0">${t("team")} ${s.team}</h2><p style="color:var(--muted);font-size:12px">${s.name} · ${n(s.manager)}</p>${staff.map(c=>`<div class="staff-pill"><span><b><i class="status-dot ${statusDot(c.status)}"></i>${C(c)}</b><br><small>${t(c.status)} · ${t("customer")} ${c.customers} · ${t("pending")} ${c.pending} · ${c.specialty}</small></span><button class="btn blue" onclick="openTransfer(${c.id})">${t("transferRequest")}</button></div>`).join("")}</div>`}).join("")}</div><div class="card" style="margin-top:14px"><div class="card-head"><div><h2>${t("coordinationBox")}</h2><p>${t("affiliationDesc")}</p></div></div><div class="card-body"><div class="table-wrap"><table><thead><tr><th>${t("requester")}</th><th>${t("target")}</th><th>${t("current")}</th><th>${t("changeTo")}</th><th>${t("customerScope")}</th><th>${t("reason")}</th><th>${t("status")}</th><th>${t("action")}</th></tr></thead><tbody>${transferRequests.map(r=>`<tr><td>${r.requester}</td><td><b>${n(r.target)}</b></td><td>${r.current}</td><td>${r.next}</td><td>${r.scope}</td><td>${r.reason}</td><td><span class="badge amber">${t(r.status)}</span></td><td><button class="btn green" onclick="approveTransfer(${r.id})">${t("approveWord")}</button> <button class="btn red" onclick="toast('${t("rejectWord")}')">${t("rejectWord")}</button></td></tr>`).join("")}</tbody></table></div></div></div>`}
function openTransfer(id){const c=counselors.find(x=>x.id===id);openModal(t("transferRequest"),`<p>${C(c)} · ${c.supervisor}</p><textarea rows="4"></textarea>`,`<button class="btn" onclick="closeModal()">${t("cancel")}</button><button class="btn blue" onclick="closeModal();toast('${t("save")}')">${t("save")}</button>`)}
function approveTransfer(id){toast(t("approveWord"))}
function customerById(id){return customerQueue.find(x=>x.id===id)||customerQueue[0]}function counselorById(id){return counselors.find(x=>x.id===id)}
function activeCounselors(sup){return counselors.filter(c=>c.supervisor===sup && c.status!=="statusOffline" && !excludedAutoAssign.includes(c.id))}
function renderAssignment(){
 setTitle("assignment","assignmentDesc");
 const selected=assignedCustomers[selectedAssignedIndex]||assignedCustomers[0];
 const currentCounselor=selected?counselors.find(c=>c.key===selected.counselor):null;
 const currentTeam=selected?selected.team:"A";
 const available=counselors.filter(c=>c.supervisor===`Supervisor ${currentTeam}` && c.status!=="statusOffline" && !excludedAutoAssign.includes(c.id));
 document.getElementById("page").innerHTML=`
 <div class="grid kpi">
   <div class="kpi-card"><div class="kpi-label">${t("waitingAssignment")}</div><div class="kpi-value">0</div><div class="kpi-sub">${t("noManualQueue")}</div></div>
   <div class="kpi-card"><div class="kpi-label">${t("autoAssignedCustomers")}</div><div class="kpi-value">${assignedCustomers.length}</div><div class="kpi-sub">${t("assignmentAutoDefault")}</div></div>
   <div class="kpi-card"><div class="kpi-label">${t("autoExcluded")}</div><div class="kpi-value">${excludedAutoAssign.length}</div><div class="kpi-sub">${t("statusOffline")}</div></div>
   <div class="kpi-card"><div class="kpi-label">${t("manualChanged")}</div><div class="kpi-value">${assignedCustomers.filter(x=>x.method==="manualChanged").length}</div><div class="kpi-sub">${t("assignmentHistory")}</div></div>
 </div>

 <div class="card">
   <div class="card-head">
     <div><h2>${t("assignmentAutoDefault")}</h2><p>${t("assignmentAutoDefaultDesc")}</p></div>
     <button class="btn blue" onclick="autoAssignSample()">${t("autoAssignNow")}</button>
   </div>
   <div class="card-body">
     <div class="auto-flow grid three">
       <div class="auto-step"><b>${t("autoRuleA")}</b><p>${t("autoRuleADesc")}</p></div>
       <div class="auto-step"><b>${t("autoRuleB")}</b><p>${t("autoRuleBDesc")}</p></div>
       <div class="auto-step"><b>${t("autoRuleC")}</b><p>${t("autoRuleCDesc")}</p></div>
     </div>
     <div class="auto-step" style="margin-top:10px"><b>${t("autoRuleD")}</b><p>${t("autoRuleDDesc")}</p></div>
   </div>
 </div>

 <div class="assignment-layout">
   <div class="card">
     <div class="card-head"><div><h2>${t("autoAssignedCustomers")}</h2><p>${t("autoAssignedCustomersDesc")}</p></div><span class="badge green">${t("autoAssigned")}</span></div>
     <div class="card-body list">
       ${assignedCustomers.map((x,i)=>`<div class="assigned-card ${i===selectedAssignedIndex?'active':''}" onclick="selectedAssignedIndex=${i};renderAssignment()">
         <div class="item-top"><b>${x.company}</b><span class="badge ${x.priority==='highRisk'?'red':x.priority==='urgent'?'amber':'blue'}">${t(x.priority)}</span></div>
         <p style="margin:0;color:var(--muted);font-size:12px">${t("currentAssignment")}: ${x.supervisor} / ${n(x.counselor)} · ${x.time}</p>
         <div class="customer-meta">${x.taxes.map(tx=>`<span class="badge purple">${tx}</span>`).join("")}<span class="badge ${x.method==='manualChanged'?'amber':'green'}">${t(x.method)}</span></div>
       </div>`).join("")}
     </div>
   </div>

   <div class="reassign-panel">
     <div class="card">
       <div class="card-head"><div><h2>${t("manualTeamChange")}</h2><p>${t("manualTeamChangeDesc")}</p></div></div>
       <div class="card-body">
         ${selected?`
         <div class="assignment-rule">
           <b>${selected.company}</b>
           <p>${t("currentAssignment")}: ${selected.supervisor} / ${n(selected.counselor)}</p>
         </div>
         <div style="height:10px"></div>
         <div class="assign-choice">
           <label>${t("supervisorGroup")}
             <select id="reassignTeam" onchange="refreshReassignCounselors()">
               ${supervisors.map(s=>`<option value="${s.team}" ${s.team===selected.team?'selected':''}>${s.name} · ${t("team")} ${s.team}</option>`).join("")}
             </select>
           </label>
           <label>${t("counselor")}
             <select id="reassignCounselor">
               ${available.map(c=>`<option value="${c.key}" ${c.key===selected.counselor?'selected':''}>${C(c)} · ${t(c.status)} · ${c.specialty}</option>`).join("")}
             </select>
           </label>
         </div>
         <div style="height:10px"></div>
         <label>${t("changeReason")}
           <textarea id="reassignReason" rows="4" placeholder="${t("changeReason")}"></textarea>
         </label>
         <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
           <button class="btn green" onclick="confirmReassignment()">${t("confirmReassign")}</button>
         </div>`:`<p>${t("selectAssignedCustomer")}</p>`}
       </div>
     </div>

     <div class="card">
       <div class="card-head"><div><h2>${t("assignmentHistory")}</h2><p>${t("manualTeamChangeDesc")}</p></div></div>
       <div class="card-body"><div class="table-wrap"><table>
         <thead><tr><th>${t("customer")}</th><th>${t("supervisor")}</th><th>${t("counselor")}</th><th>${t("assignmentMethod")}</th><th>${t("date")}</th></tr></thead>
         <tbody>${assignedCustomers.map(a=>`<tr><td><b>${a.company}</b></td><td>${a.supervisor}</td><td>${n(a.counselor)}</td><td>${t(a.method)}</td><td>${a.time}</td></tr>`).join("")}</tbody>
       </table></div></div>
     </div>
   </div>
 </div>`;
}
function refreshReassignCounselors(){
 const team=document.getElementById("reassignTeam").value;
 const select=document.getElementById("reassignCounselor");
 const available=counselors.filter(c=>c.supervisor===`Supervisor ${team}` && c.status!=="statusOffline" && !excludedAutoAssign.includes(c.id));
 select.innerHTML=available.map(c=>`<option value="${c.key}">${C(c)} · ${t(c.status)} · ${c.specialty}</option>`).join("");
}
function confirmReassignment(){
 const selected=assignedCustomers[selectedAssignedIndex];
 if(!selected)return;
 const team=document.getElementById("reassignTeam").value;
 const counselorKey=document.getElementById("reassignCounselor").value;
 const reason=document.getElementById("reassignReason").value.trim()||t("changeReason");
 selected.team=team;
 selected.supervisor=`Supervisor ${team}`;
 selected.counselor=counselorKey;
 selected.method="manualChanged";
 selected.reason=reason;
 selected.time="now";
 audit.unshift(["now",`${selected.company} / ${t("manualTeamChange")} / ${selected.supervisor} / ${n(selected.counselor)} / ${reason}`]);
 toast(t("reassignDone"));
 renderAssignment();
}
function autoAssignSample(){
 const sampleNo=assignedCustomers.length+1;
 const target=counselors.find(c=>c.key==="han")||counselors[0];
 assignedCustomers.unshift({company:`PT Auto Sample ${sampleNo}`,supervisor:target.supervisor,team:target.team,counselor:target.key,method:"autoAssigned",reason:"recommended",time:"now",taxes:["PPN","PPh 23"],priority:"normal"});
 selectedAssignedIndex=0;
 audit.unshift(["now",`PT Auto Sample ${sampleNo} / ${t("autoAssigned")} / ${target.supervisor} / ${C(target)}`]);
 toast(t("autoAssignDone"));
 renderAssignment();
}
function openAssignMemo(){openModal(t("manualMemo"),`<p>${t("manualMemo")}</p><textarea rows="4"></textarea>`,`<button class="btn" onclick="closeModal()">${t("cancel")}</button><button class="btn blue" onclick="closeModal();toast('${t("save")}')">${t("save")}</button>`)}
function confirmAssign(){autoAssignSample()}

function renderBilling(){setTitle("billing","billingDesc");document.getElementById("page").innerHTML=`<div class="card"><div class="card-head"><div><h2>${t("billing")}</h2><p>${t("billingFlow")}</p></div></div><div class="card-body"><div class="table-wrap"><table><thead><tr><th>${t("customer")}</th><th>${t("taxType")}</th><th>${t("period")}</th><th>${t("approvedSupervisor")}</th><th>${t("approvedTime")}</th><th>${t("counselor")}</th><th>ID Billing</th><th>${t("sentToCustomer")}</th><th>NTPN</th></tr></thead><tbody>${idBillingTransfers.map(x=>`<tr><td><b>${x.company}</b></td><td>${x.tax}</td><td>${x.period}</td><td>${x.supervisor}</td><td>${x.approved}</td><td>${n(x.counselor)}</td><td><span class="badge ${x.billing==='completedStatus'?'green':'amber'}">${t(x.billing)}</span></td><td>${t(x.sent)}</td><td><span class="badge cyan">${t(x.ntpn)}</span></td></tr>`).join("")}</tbody></table></div></div></div>`}
function renderAudit(){setTitle("audit","auditDesc");document.getElementById("page").innerHTML=`<div class="card"><div class="card-head"><div><h2>${t("audit")}</h2><p>${t("auditEvidence")}</p></div></div><div class="card-body timeline">${audit.map(x=>`<div class="log"><div class="log-time">${x[0]}</div><div class="log-body">${x[1]}</div></div>`).join("")}</div></div>`}
function openMonthlyReport(){openModal(t("reportTitle"),`<div class="report-cover"><h3>${t("reportCover")}</h3><p>${t("reportScope")}</p></div><div class="report-grid"><div class="report-kpi"><span>${t("rank")}</span><b>#1</b></div><div class="report-kpi"><span>${t("completed")}</span><b>128</b></div><div class="report-kpi"><span>${t("rejectionRate")}</span><b>3.2%</b></div><div class="report-kpi"><span>${t("avgTime")}</span><b>21</b></div></div><div class="report-section"><h4>${t("reportTeamPerf")}</h4><div class="table-wrap"><table><thead><tr><th>${t("rank")}</th><th>${t("team")}</th><th>${t("supervisor")}</th><th>${t("completed")}</th><th>${t("rejectionRate")}</th><th>${t("avgTime")}</th><th>${t("teamScore")}</th></tr></thead><tbody>${supervisors.map((s,i)=>`<tr><td>${i+1}</td><td>${t("team")} ${s.team}</td><td>${n(s.manager)}</td><td>${s.done}</td><td>${s.rejectRate}%</td><td>${s.avg}</td><td>${s.score}</td></tr>`).join("")}</tbody></table></div></div><div class="report-section"><h4>${t("reportComment")}</h4><div><ul><li>${t("reportComment1")}</li><li>${t("reportComment2")}</li></ul></div></div>`,`<button class="btn" onclick="closeModal()">${t("close")}</button><button class="btn blue" onclick="toast('${t("downloadSample")}')">${t("downloadSample")}</button>`);document.querySelector("#modalBg .modal").classList.add("report-modal")}
function render(){setStatic();try{if(view==="dashboard")renderDashboard();else if(view==="approval")renderApproval();else if(view==="evaluation")renderEvaluation();else if(view==="affiliation")renderAffiliation();else if(view==="assignment")renderAssignment();else if(view==="billing")renderBilling();else if(view==="audit")renderAudit()}catch(e){console.error(e);document.getElementById("page").innerHTML=`<div class="card"><div class="card-body"><pre>${e.message}</pre></div></div>`}}
render();
</script>
</body>
</html>
