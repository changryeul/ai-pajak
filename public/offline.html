<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Pajak — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .container { text-align: center; max-width: 400px; }
    .icon { width: 80px; height: 80px; background: linear-gradient(135deg, #3b82f6, #6366f1); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .icon svg { width: 40px; height: 40px; color: white; }
    h1 { font-size: 24px; color: #1e293b; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; margin-bottom: 24px; line-height: 1.6; }
    button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 11-12.728 0M12 9v4m0 4h.01" />
      </svg>
    </div>
    <h1>Anda Sedang Offline</h1>
    <p>Koneksi internet tidak tersedia. Periksa koneksi Anda dan coba lagi.</p>
    <p style="font-size: 12px; color: #94a3b8;">인터넷 연결이 없습니다. 연결을 확인하고 다시 시도해주세요.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
